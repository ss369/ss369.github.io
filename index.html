<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .loading-box { text-align: center; }
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.05);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border-left-color: #0071e3;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 15px; font-weight: 500; margin: 0; }
    </style>
</head>
<body>

    <div class="loading-box">
        <div class="spinner"></div>
        <p>Connecting...</p>
    </div>

    <script>
        const email = "example@email.com"; 
        const website = "https://yourwebsite.com"; 

        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
            // === 【手机端：微秒级事件拦截方案】 ===
            let isAppOpening = false;

            // 1. 极其灵敏地捕捉手机浏览器即将被切入后台的瞬间
            const handleHide = function() {
                isAppOpening = true; // 确认邮箱客户端正在打开
            };
            window.addEventListener('pagehide', handleHide, { once: true });
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) handleHide();
            }, { once: true });

            // 2. 瞬间拉起邮箱
            window.location.href = "mailto:" + email;

            // 3. 此时等待时间可以从 400ms 直接压缩到 150ms！
            // 150ms 只是为了给底层系统处理 mailto 留出一眨眼的时间，
            // 如果成功拉起，上面的事件会在 50-100ms 内触发并锁死 isAppOpening。
            setTimeout(function() {
                if (!isAppOpening) {
                    window.location.replace(website); // 使用 replace 替换当前历史记录，跳转速度比 href 更快
                }
            }, 150);

        } else {
            // === 【电脑端：零延迟逻辑保持不变】 ===
            let hasLeft = false;

            window.addEventListener('blur', function() {
                hasLeft = true;
            }, { once: true });

            window.addEventListener('focus', function() {
                window.location.replace(website);
            }, { once: true });

            window.location.href = "mailto:" + email;

            setTimeout(function() {
                if (!hasLeft) {
                    window.location.replace(website);
                }
            }, 400);
        }
    </script>

</body>
</html>
